services:
  crit-db:
    image: postgres:18
    container_name: crit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: crit_assistance
    ports:
      - "5432:5432"
    volumes:
      - crit_db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
      - ./seeds:/seeds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crit_assistance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  crit_db_data:
