services:
  crit-db:
    build:
      context: .
    image: crit-db:local
    container_name: crit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crit_db}
      APP_DB_USER: ${APP_DB_USER:-crit_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-crit_app}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-crit_platform_app}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-crit_platform_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - crit-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          && test "$$(psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT to_regclass('public.tenants') IS NOT NULL")" = "t"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  crit-db-data:
